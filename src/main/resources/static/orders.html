<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Orders - Foodie</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f8faf9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #1f2937 !important;
            padding: 15px 0;
        }

        .orders-title {
            font-weight: 700;
            color: #1f2937;
        }

        .order-card {
            background: white;
            border-radius: 18px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: 0.3s;
        }

        .order-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .order-id {
            font-size: 18px;
            font-weight: 700;
            color: #198754;
        }

        .food-name {
            font-size: 20px;
            font-weight: 700;
            color: #222;
        }

        .order-info {
            color: #666;
            margin-top: 8px;
        }

        .price {
            font-size: 18px;
            font-weight: 700;
            color: #198754;
        }

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #e8f7f3;
            color: #198754;
            font-weight: 600;
            font-size: 14px;
        }

        .empty-orders {
            background: white;
            border-radius: 18px;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .empty-orders h3 {
            margin-bottom: 10px;
        }

        .browse-btn {
            background: #198754;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 11px 25px;
            font-weight: 600;
        }

        .browse-btn:hover {
            background: #157347;
            color: white;
        }

        .food-image {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 14px;
        }

        @media (max-width: 576px) {

            .food-image {
                width: 75px;
                height: 75px;
            }

            .food-name {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>


<!-- Navbar -->

<nav class="navbar navbar-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html">

            🍴 Foodie

        </a>


        <div>

            <a
                href="foods.html"
                class="btn btn-outline-light me-2">

                🍽️ Food

            </a>

            <a
                href="cart.html"
                class="btn btn-outline-light">

                🛒 Cart

            </a>

        </div>

    </div>

</nav>


<!-- Orders -->

<div class="container py-5">

    <h2 class="orders-title mb-4">

        📦 My Orders

    </h2>


    <div id="ordersContainer">

        <!-- Orders will appear here -->

    </div>

</div>


<script src="js/orders.js"></script>

</body>

</html>
