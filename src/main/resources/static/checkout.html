<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout - Foodie</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            padding: 15px 0;
        }

        .checkout-title {
            font-weight: 700;
        }

        .checkout-card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .place-order-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px;
            background: #198754;
            color: white;
            font-weight: 600;
            font-size: 17px;
        }

        .place-order-btn:hover {
            background: #157347;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .total-row {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 20px;
            font-weight: 700;
        }

    </style>

</head>


<body>


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                🍴 Foodie

            </a>


            <a class="btn btn-outline-light"
               href="cart.html">

                🛒 Back to Cart

            </a>

        </div>

    </nav>



    <!-- Checkout -->

    <div class="container py-5">

        <h2 class="checkout-title mb-4">

            📍 Delivery Address

        </h2>


        <div class="row g-4">


            <!-- Address Form -->

            <div class="col-lg-8">

                <div class="checkout-card">

                    <h4 class="mb-4">

                        Enter your delivery details

                    </h4>


                    <form id="addressForm">


                        <!-- House Number -->

                        <div class="mb-3">

                            <label class="form-label">

                                House Number

                            </label>

                            <input
                                type="text"
                                id="houseNo"
                                class="form-control"
                                placeholder="Enter house number"
                                required
                            >

                        </div>


                        <!-- Street -->

                        <div class="mb-3">

                            <label class="form-label">

                                Street

                            </label>

                            <input
                                type="text"
                                id="street"
                                class="form-control"
                                placeholder="Enter street name"
                                required
                            >

                        </div>


                        <div class="row">


                            <!-- City -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    City

                                </label>

                                <input
                                    type="text"
                                    id="city"
                                    class="form-control"
                                    placeholder="Enter city"
                                    required
                                >

                            </div>


                            <!-- State -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    State

                                </label>

                                <input
                                    type="text"
                                    id="state"
                                    class="form-control"
                                    placeholder="Enter state"
                                    required
                                >

                            </div>

                        </div>


                        <!-- Pincode -->

                        <div class="mb-4">

                            <label class="form-label">

                                Pincode

                            </label>

                            <input
                                type="text"
                                id="pincode"
                                class="form-control"
                                placeholder="Enter 6-digit pincode"
                                maxlength="6"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="place-order-btn">

                            Continue to Payment →

                        </button>


                    </form>


                    <div
                        id="message"
                        class="mt-3 text-center">
                    </div>

                </div>

            </div>



            <!-- Order Summary -->

            <div class="col-lg-4">

                <div class="checkout-card">

                    <h4 class="mb-4">

                        Order Summary

                    </h4>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span id="subtotal">
                            ₹0
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery Fee
                        </span>

                        <span>
                            ₹40
                        </span>

                    </div>


                    <div class="summary-row total-row">

                        <span>
                            Total
                        </span>

                        <span id="total">
                            ₹40
                        </span>

                    </div>

                </div>

            </div>


        </div>

    </div>

<script src="js/checkout.js"></script>
</body>

</html>
