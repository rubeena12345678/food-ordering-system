<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment - Foodie</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            padding: 15px 0;
        }

        .payment-title {
            font-weight: 700;
        }

        .payment-card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .payment-option {
            border: 2px solid #e5e5e5;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        .payment-option:hover {
            border-color: #198754;
        }

        .payment-option input {
            margin-right: 10px;
        }

        .payment-icon {
            font-size: 25px;
            margin-right: 10px;
        }

        .pay-btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 14px;
            background: #198754;
            color: white;
            font-weight: 600;
            font-size: 17px;
        }

        .pay-btn:hover {
            background: #157347;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .total-row {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 20px;
            font-weight: 700;
        }

    </style>

</head>


<body>


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold"
               href="index.html">

                🍴 Foodie

            </a>


            <a class="btn btn-outline-light"
               href="checkout.html">

                ← Back

            </a>

        </div>

    </nav>



    <!-- Payment -->

    <div class="container py-5">

        <h2 class="payment-title mb-4">

            💳 Choose Payment Method

        </h2>


        <div class="row g-4">


            <!-- Payment Methods -->

            <div class="col-lg-8">

                <div class="payment-card">

                    <h4 class="mb-4">

                        Select Payment Method

                    </h4>


                    <!-- Cash on Delivery -->

                    <label class="payment-option d-block">

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="Cash on Delivery"
                            checked
                        >

                        <span class="payment-icon">
                            💵
                        </span>

                        <strong>
                            Cash on Delivery
                        </strong>

                        <br>

                        <small class="text-muted ms-5">

                            Pay when your order arrives.

                        </small>

                    </label>



                    <!-- UPI -->

                    <label class="payment-option d-block">

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="UPI"
                        >

                        <span class="payment-icon">
                            📱
                        </span>

                        <strong>
                            UPI
                        </strong>

                        <br>

                        <small class="text-muted ms-5">

                            Pay using your UPI app.

                        </small>

                    </label>



                    <!-- Card -->

                    <label class="payment-option d-block">

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="Card"
                        >

                        <span class="payment-icon">
                            💳
                        </span>

                        <strong>
                            Credit / Debit Card
                        </strong>

                        <br>

                        <small class="text-muted ms-5">

                            Pay securely using your card.

                        </small>

                    </label>


                    <button
                        id="payButton"
                        class="pay-btn mt-3">

                        Confirm Payment →

                    </button>


                    <div
                        id="message"
                        class="mt-3 text-center">
                    </div>

                </div>

            </div>



            <!-- Order Summary -->

            <div class="col-lg-4">

                <div class="payment-card">

                    <h4 class="mb-4">

                        Order Summary

                    </h4>


                    <div class="summary-row">

                        <span>
                            Subtotal
                        </span>

                        <span id="subtotal">
                            ₹250
                        </span>

                    </div>


                    <div class="summary-row">

                        <span>
                            Delivery Fee
                        </span>

                        <span>
                            ₹40
                        </span>

                    </div>


                    <div class="summary-row total-row">

                        <span>
                            Total
                        </span>

                        <span id="total">
                            ₹290
                        </span>

                    </div>

                </div>

            </div>


        </div>

    </div>
<script src="js/payment.js"></script>

</body>

</html>
