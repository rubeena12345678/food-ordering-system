<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Confirmation - Foodie</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f5f7f8;

            font-family: Arial, sans-serif;
        }

        .confirmation-card {
            width: 90%;
            max-width: 850px;

            background: white;

            padding: 55px 40px;

            text-align: center;

            border-radius: 25px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .success-icon {
            width: 115px;
            height: 115px;

            margin: 0 auto 30px;

            border-radius: 50%;

            background: #d1e7dd;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 65px;

            color: #198754;
        }

        h1 {
            color: #198754;

            font-size: 48px;

            margin-bottom: 20px;
        }

        .thank-you {
            font-size: 20px;

            color: #555;

            margin-bottom: 25px;
        }

        .success-message {
            font-size: 19px;

            color: #333;

            margin-bottom: 35px;
        }

        .details {
            background: #f8f9fa;

            border-radius: 18px;

            padding: 25px;

            text-align: left;

            margin-bottom: 30px;
        }

        .detail-row {
            display: flex;

            justify-content: space-between;

            margin-bottom: 18px;

            font-size: 18px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .status {
            color: #198754;

            font-weight: bold;
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 15px;
        }

        .btn {
            padding: 15px 30px;

            border-radius: 10px;

            font-size: 17px;

            cursor: pointer;

            text-decoration: none;
        }

        .order-more {
            background: #198754;

            color: white;
        }

        .home {
            border: 1px solid #333;

            color: #333;

            background: white;
        }

        .order-more:hover {
            background: #157347;
        }

        .home:hover {
            background: #f1f1f1;
        }

    </style>

</head>

<body>

    <div class="confirmation-card">

        <div class="success-icon">
            ✓
        </div>

        <h1>
            Order Confirmed!
        </h1>

        <div class="thank-you">
            Thank you for ordering with Foodie! 🎉
        </div>

        <div class="success-message">
            Your order has been placed successfully.
        </div>


        <div class="details">

            <div class="detail-row">

                <span>
                    Order ID
                </span>

                <strong id="orderId">
                    -
                </strong>

            </div>


            <div class="detail-row">

                <span>
                    Payment ID
                </span>

                <strong id="paymentId">
                    -
                </strong>

            </div>


            <div class="detail-row">

                <span>
                    Payment Status
                </span>

                <strong class="status">
                    Successful
                </strong>

            </div>

        </div>


        <div class="buttons">

            <a
                href="foods.html"
                class="btn order-more">

                🍔 Order More

            </a>


            <a
                href="index.html"
                class="btn home">

                🏠 Home

            </a>

        </div>

    </div>


    <script>

        const orderId =
            localStorage.getItem("orderId");

        const paymentId =
            localStorage.getItem("paymentId");


        document.getElementById("orderId")
            .textContent =
            orderId || "-";


        document.getElementById("paymentId")
            .textContent =
            paymentId || "-";

    </script>

</body>

</html>
