<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cart - Foodie</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f8f9fa;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 24px;
        }

        .cart-container {
            max-width: 1100px;
            margin: 40px auto;
        }

        .cart-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .food-image {
            width: 120px;
            height: 100px;
            object-fit: cover;
            border-radius: 12px;
        }

        .food-name {
            font-size: 20px;
            font-weight: bold;
        }

        .food-category {
            color: #777;
        }

        .food-price {
            font-size: 18px;
            font-weight: bold;
            color: #198754;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 50%;
            background: #198754;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .quantity {
            font-size: 18px;
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .remove-btn {
            border: none;
            background: #dc3545;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
        }

        .summary-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: sticky;
            top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .total-row {
            font-size: 22px;
            font-weight: bold;
            border-top: 1px solid #ddd;
            padding-top: 15px;
        }

        .checkout-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #198754;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        .checkout-btn:hover {
            background: #157347;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="foods.html">
            🍴 Foodie
        </a>

        <div>
            <a href="foods.html" class="btn btn-outline-light me-2">
                Foods
            </a>

            <a href="cart.html" class="btn btn-success">
                🛒 Cart
            </a>
        </div>
    </div>
</nav>


<!-- Main Container -->
<div class="container cart-container">

    <div class="row g-4">

        <!-- Cart Items -->
        <div class="col-lg-8">

            <h2 class="mb-4">🛒 My Cart</h2>

            <div id="cartContainer"></div>

            <div id="message"></div>

        </div>


        <!-- Order Summary -->
        <div class="col-lg-4">

            <div class="summary-card">

                <h3 class="mb-4">
                    Order Summary
                </h3>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery Fee</span>
                    <span id="deliveryFee">₹40</span>
                </div>

                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="total">₹0</span>
                </div>

                <!-- IMPORTANT: Checkout button -->
                <button
                    type="button"
                    class="checkout-btn mt-3"
                    onclick="window.location.href='checkout.html'">
                    Proceed to Checkout
                </button>

            </div>

        </div>

    </div>

</div>


<script src="js/cart.js"></script>

</body>
</html>
