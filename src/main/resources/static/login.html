<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Foodie</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                🍴 Foodie
            </a>

            <a class="btn btn-outline-light"
               href="index.html">
                Home
            </a>

        </div>

    </nav>


    <!-- Login Section -->
    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow mt-5">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            Login
                        </h2>

                        <form id="loginForm">

                            <!-- Email -->
                            <div class="mb-3">

                                <label for="email"
                                       class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    placeholder="Enter your email"
                                    required>

                            </div>


                            <!-- Password -->
                            <div class="mb-3">

                                <label for="password"
                                       class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter your password"
                                    required>

                            </div>


                            <!-- Login Button -->
                            <button
                                type="submit"
                                class="btn btn-primary w-100">
                                Login
                            </button>

                        </form>


                        <!-- Message -->
                        <div id="message"
                             class="mt-3 text-center">
                        </div>


                        <!-- Register -->
                        <p class="text-center mt-3">

                            Don't have an account?

                            <a href="register.html">
                                Register
                            </a>

                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>
    <script src="js/login.js"></script>

</body>

</html>
